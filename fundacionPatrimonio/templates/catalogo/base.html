{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Fundacion Patrimonial Vivo</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark-bg-dark">   
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">Patrimonio vivo</a>
            <div class="ms-auto d-flex">
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3 text-dark">Hola {{user.username}}</span>
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn sm">Cerrar sesion</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-success btn-sm">Iniciar Sesion</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="bg-dark text-start py-4  mt-auto">
        <div class="container text-light">
          <h5>Contacto: +56 2 1234 5678</h5>
          <h5>E-Mail: fundacion@patrimoniovivo.cl</h5>

        </div>
    </footer>
    
    
</body>
</html>
