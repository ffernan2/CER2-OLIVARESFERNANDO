{% extends 'catalogo/base.html' %}

{% block content %}
<div class="row mt-4">
    <div class="col-md-6 mb-4">
        <img src="{{lugar.imagen}}" class="img-fluid rounded shadow" alt="{{lugar.nombre}}">
    </div>

    <div>
        <h2>{{ lugar.nombre }}</h2>
        <span class="badge bg-info text-blue mb-3">{{ lugar.categoria }}</span>
        <p>
            <strong> Ubicacion: </strong> {{ lugar.ubicacion}}
        </p>
        <p>
            <strong> Año: </strong> {{ lugar.anio_construccion}}
        </p>
        <hr>
        <h4>Descripcion</h4>
        <p class="text-justify"> {{ lugar.descripcion }}</p>
        <a href="{% url 'catalogo' %}" class="btn btn-outline-secondary mt-3">Volver a Catalogo</a>
    </div>
</div>

{% endblock %}
